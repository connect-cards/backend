name: Generate Monthly Puzzles

on:
  schedule:
    - cron: "0 0 5 * *"   # Runs monthly on the 5th
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create branch
        run: |
          branch_name="monthly-generation-$(date +%Y-%m-%d-%H%M%S)"
          git checkout -b "$branch_name"
          echo "BRANCH_NAME=$branch_name" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate puzzles and lexicon for next month
        run: tsx src/createAll.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Github Actions"
          git config user.email "bot@github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git add .
          git commit -m "Monthly puzzle + lexicon update"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create --base main --head "$BRANCH_NAME" --title "Monthly puzzle + lexicon update ($(date +%Y-%m))" --body "Automated monthly puzzle and lexicon generation."